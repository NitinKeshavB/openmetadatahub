# Pull-request and main checks: lint, tests with the coverage gate, and the bundle against the CLI's schema.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: databricks/setup-cli@v1.20.0
      - run: make install
      - run: make lint-ci
      - run: make test
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports/
      - name: Placeholders still to fill in (informational)
        run: make check-placeholders
