[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openmetadatahub"
version = "0.1.0"
description = "Data quality, data contracts, Databricks access governance and AI governance in one metadata hub."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
databricks = ["databricks-sql-connector>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["openmetadatahub[api]", "pytest>=8", "httpx>=0.27", "sqlglot>=25", "pyspark>=4.0", "databricks-bundles", "build"]

[project.scripts]
openmetadatahub = "openmetadatahub.cli:main"
omh-enforce-contracts = "openmetadatahub.jobs.entrypoints:enforce_contracts_main"
omh-audit-access = "openmetadatahub.jobs.entrypoints:audit_access_main"
omh-assess-ai = "openmetadatahub.jobs.entrypoints:assess_ai_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
